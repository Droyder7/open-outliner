# Phase 0 topology: Postgres + MinIO only. web + app are added in Phase 12 (OPS).
# See docs/self-hosting.md for the full self-host topology and restore ordering.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outliner
      POSTGRES_PASSWORD: outliner
      POSTGRES_DB: outliner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outliner -d outliner"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
