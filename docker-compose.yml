# Text-only default. Attachments use an explicitly configured external S3 bucket.
# See docs/self-hosting.md; image digests are updated deliberately after validation.
services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: outliner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outliner}
      POSTGRES_DB: outliner
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outliner -d outliner']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      DATABASE_URL: postgres://outliner:${POSTGRES_PASSWORD:-outliner}@postgres:5432/outliner
      PORT: '8787'
      WS_PORT: '8788'
      AUTOMATIC_GC: 'false'
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-open-outliner}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - '127.0.0.1:${APP_HTTP_PORT:-8787}:8787'
      - '127.0.0.1:${APP_WS_PORT:-8788}:8788'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
