# V1 self-host topology: web (PWA static) + app (Node API+Hocuspocus) + Postgres + MinIO.
# See docs/self-hosting.md for backup/restore ordering and operational guidance.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outliner
      POSTGRES_PASSWORD: outliner
      POSTGRES_DB: outliner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outliner -d outliner"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      DATABASE_URL: postgres://outliner:outliner@postgres:5432/outliner
      PORT: "8787"
      WS_PORT: "8788"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: open-outliner
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8787:8787"
      - "8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_SYNC_URL: http://localhost:8788
      VITE_API_BASE_URL: http://localhost:8787
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  pgdata:
  miniodata:
