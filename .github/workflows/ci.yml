name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.15.1'
jobs:
  checks:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: PostgreSQL, optional S3 & Browser Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: outliner
          POSTGRES_PASSWORD: outliner
          POSTGRES_DB: outliner
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U outliner -d outliner"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://outliner:outliner@127.0.0.1:5432/outliner
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: S3RVER
      S3_SECRET_ACCESS_KEY: S3RVER
      S3_BUCKET: open-outliner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-outliner/shared build && pnpm --filter @open-outliner/crdt build
      - run: pnpm migrate
      - name: Start pinned S3 test emulator
        run: |
          mkdir -p /tmp/outliner-s3
          pnpm exec s3rver -d /tmp/outliner-s3 -a 127.0.0.1 -p 9000 --silent --no-vhost-buckets > /tmp/outliner-s3.log 2>&1 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:9000 > /dev/null; do sleep 1; done'
      - run: pnpm --filter @open-outliner/server test
      - run: pnpm --filter @open-outliner/client build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance checks
        run: |
          pnpm --filter @open-outliner/server exec tsx src/main.ts > /tmp/outliner-server.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8787/health > /dev/null; do sleep 1; done'
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-and-server-diagnostics
          path: |
            test-results/
            /tmp/outliner-server.log
            /tmp/outliner-s3.log

  smoke:
    name: Pinned Containers, Clean Deployment & Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-outliner/shared build && pnpm --filter @open-outliner/crdt build
      - run: docker compose build app web
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Create, persist, log in again and read through the web proxy
        run: SMOKE_FIXTURE_FILE=/tmp/restore-fixture.json node packages/server/scripts/self-host-smoke.mjs
      - name: Backup and isolated restore
        run: |
          scripts/backup.sh /tmp/outliner-backup
          export RESTORE_DOCUMENT_ID=$(jq -r .documentId /tmp/restore-fixture.json)
          export RESTORE_EXPECT_TEXT=$(jq -r .marker /tmp/restore-fixture.json)
          scripts/restore-drill.sh /tmp/outliner-backup outliner_restore_ci
          if scripts/restore-drill.sh /tmp/outliner-backup outliner_restore_ci; then
            echo 'Restore must refuse to overwrite an existing database' >&2
            exit 1
          fi
          curl -sf http://127.0.0.1:8080/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down -v
